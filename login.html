<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RizeFly — Вход</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/iconk.jpg">
</head>
<body>
<header class="site-header">
    <div class="site-header-inner">
        <div class="logo"><a href="index.html" class="logo-link"><img src="img/logo.svg" alt="RizeFly" class="logo-img"></a></div>
        <nav class="navigation">
            <a href="index.html" class="nav_link">ГЛАВНАЯ</a>
            <a href="catalog.html" class="nav_link">КАТАЛОГ</a>
            <a href="about.html" class="nav_link">О НАС</a>
            <a href="contacts.html" class="nav_link">КОНТАКТЫ</a>
            <a href="login.html" class="nav_link">ВХОД</a>
        </nav>
    </div>
</header>

<section class="auth-page">
    <div class="container">
        <div class="auth-wrapper">
            <h1 class="auth-title">Вход</h1>
            <form class="auth-form" onsubmit="alert('Форма входа (демо)'); return false;">
                <div class="form-group"><label>Логин или Email</label><input type="text" required></div>
                <div class="form-group"><label>Пароль</label><input type="password" required></div>
                <button type="submit" class="auth-btn">Войти</button>
            </form>
            <div class="auth-links">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
        </div>
    </div>
</section>

<footer class="site-footer">
    <div class="footer-overlay"></div>
    <div class="site-footer-inner">
        <div class="footer-grid">
            <div class="footer-col"><h4>RizeFly</h4><p>Интернет-магазин мерча Dota 2.</p></div>
            <div class="footer-col"><h4>Навигация</h4><ul><li><a href="index.html">Главная</a></li><li><a href="catalog.html">Каталог</a></li></ul></div>
            <div class="footer-col"><h4>Покупателям</h4><ul><li><a href="cart.html">Корзина</a></li><li><a href="login.html">Вход</a></li></ul></div>
            <div class="footer-col"><h4>Контакты</h4><p>+7 (800) 555-35-35</p></div>
        </div>
        <div class="footer-bottom"><p>© 2026 RizeFly.</p></div>
    </div>
</footer>
<a href="#" class="scroll-top">↑</a>
<script>
    let b = document.querySelector('.scroll-top');
    window.onscroll = () => { if (window.scrollY > 300) b.style.display='flex'; else b.style.display='none'; const h=document.querySelector('.site-header'); if(window.scrollY>50)h.classList.add('scrolled'); else h.classList.remove('scrolled'); };
    b.onclick = () => { window.scrollTo({top:0,behavior:'smooth'}); return false; };
</script>
</body>
</html>
